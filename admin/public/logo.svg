<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Mall Ops 跨境电商运营数据中台">
  <title>Mall Ops · 跨境电商运营数据中台</title>
  <defs>
    <clipPath id="mo-globe">
      <circle cx="32" cy="39" r="13"/>
    </clipPath>
    <linearGradient id="mo-cyan" x1="16" y1="20" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25F4EE"/>
      <stop offset="1" stop-color="#5FFBF1"/>
    </linearGradient>
  </defs>

  <!-- TikTok 标志性双色错位：品红副本（先画，位于左下偏移位） -->
  <g transform="translate(2.6 2.6)" opacity=".5">
    <path d="M22.6 30a9.4 9.4 0 0 1 18.8 0" stroke="#FE2C55" stroke-width="4" stroke-linecap="round"/>
    <circle cx="32" cy="39" r="13" stroke="#FE2C55" stroke-width="4"/>
    <g clip-path="url(#mo-globe)" stroke="#FE2C55" stroke-width="2.1" stroke-linecap="round">
      <ellipse cx="32" cy="39" rx="5" ry="13"/>
      <path d="M17 39H47"/>
      <path d="M17 32.5H47"/>
      <path d="M17 45.5H47"/>
    </g>
  </g>

  <!-- 主体：地球购物袋（青色） -->
  <g>
    <!-- 提手 -->
    <path d="M22.6 30a9.4 9.4 0 0 1 18.8 0" stroke="url(#mo-cyan)" stroke-width="4" stroke-linecap="round"/>
    <!-- 袋身 = 地球 -->
    <circle cx="32" cy="39" r="13" stroke="url(#mo-cyan)" stroke-width="4" fill="rgba(37,244,238,.09)"/>
    <!-- 经纬线 -->
    <g clip-path="url(#mo-globe)" stroke="url(#mo-cyan)" stroke-width="2.1" stroke-linecap="round" opacity=".9">
      <ellipse cx="32" cy="39" rx="5" ry="13" fill="none"/>
      <path d="M17 39H47"/>
      <path d="M17 32.5H47"/>
      <path d="M17 45.5H47"/>
    </g>
  </g>

  <!-- 上升箭头：破球而出，代表跨境增长 -->
  <g stroke="#FE2C55" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M22 46 45 23"/>
    <path d="M38 23h7v7"/>
  </g>
</svg>
